<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Pen Pro</title>
    <style>
        /* 1. 基础环境：极简，无任何滤镜 */
        body { font-family: -apple-system, sans-serif; background: #FFF9C4; margin: 0; padding: 15px; }

        /* 2. 图片：这是 Live Text 的命脉，严禁嵌套，严禁复杂样式 */
        #display-img { 
            width: 100%; height: auto; display: block; 
            border: 4px solid white; border-radius: 10px;
            -webkit-user-select: text !important;
            user-select: text !important;
            -webkit-touch-callout: default !important;
        }

        /* 3. 操作区：与图片保持物理距离 */
        .control-panel { margin-top: 20px; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-pink { background: #FF66A1; color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; margin-bottom: 10px; display: block; text-align: center; text-decoration: none; }
        .btn-blue { background: #007AFF; color: white; border: none; width: 100%; padding: 20px; border-radius: 15px; font-size: 1.2rem; font-weight: 800; box-shadow: 0 5px 0 #0056B3; }
        .btn-blue:active { transform: translateY(3px); box-shadow: 0 2px 0 #0056B3; }

        /* 4. 段落排版：点击分析后才出现 */
        .paragraph-block { 
            margin-top: 25px; 
            padding: 15px; 
            background: rgba(255,255,255,0.5); /* 段落底色 */
            border-radius: 15px; 
        }
        .p-number { font-weight: bold; color: #333; font-size: 0.9rem; margin-bottom: 10px; display: block; }
        .word-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .word-card { background: white; padding: 12px 18px; border-radius: 12px; font-size: 1.8rem; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .word-card.read { background: #E5E5EA !important; color: #AEAEB2 !important; }

        /* 5. 弹窗 */
        #mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 1000; }
        #detail { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; background: white; border-radius: 30px; padding: 25px; display: none; z-index: 1100; text-align: center; }
        .active { display: block !important; }
    </style>
</head>
<body>

    <img id="display-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">

    <div class="control-panel">
        <label for="file-input" class="btn-pink">📸 1. 拍照/选取照片</label>
        <input type="file" id="file-input" accept="image/*" style="display:none">
        
        <p style="font-size:0.85rem; color:#666; margin: 10px 0;">👆 长按图中文字，点击 <b>Show Text</b> 后 <b>拷贝</b></p>
        
        <button class="btn-blue" onclick="readClipboard()">🪄 2. 分析并分段</button>
    </div>

    <div id="output-area"></div>

    <div id="mask" onclick="closeDetail()"></div>
    <div id="detail">
        <h2 id="card-zh" style="font-size:4rem; margin:0;"></h2>
        <p id="card-py" style="color:#FF66A1; font-size:1.5rem;"></p>
        <div id="card-en" style="background:#f2f2f7; padding:15px; border-radius:15px; margin-bottom:20px;"></div>
        <button onclick="speak()" style="background:#34C759; color:white; width:100%; padding:15px; border:none; border-radius:12px; font-weight:bold;">🔊 播放声音</button>
    </div>

<script>
    let dictionary = {};
    fetch('dictionary.json').then(r => r.json()).then(data => dictionary = data);

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('display-img').src = URL.createObjectURL(file);
        }
    };

    async function readClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            if (text.trim()) processText(text);
        } catch (err) { alert("请允许粘贴权限"); }
    }

    function processText(rawText) {
        const out = document.getElementById('output-area');
        out.innerHTML = "";
        
        // 识别换行符进行分段
        const lines = rawText.split(/\n+/);
        let pCount = 1;

        lines.forEach(line => {
            const cleanLine = line.replace(/[^\u4e00-\u9fa5]/g, '');
            if (!cleanLine) return;

            const block = document.createElement('div');
            block.className = 'paragraph-block';
            block.innerHTML = `<span class="p-number">段落 ${pCount++}</span>`;
            
            const grid = document.createElement('div');
            grid.className = 'word-grid';

            let i = 0;
            while (i < cleanLine.length) {
                let found = "";
                for (let len = 7; len >= 1; len--) {
                    let chunk = cleanLine.substr(i, len);
                    if (dictionary[chunk]) { found = chunk; i += len; break; }
                }
                
                const btn = document.createElement('div');
                btn.className = 'word-card';
                btn.innerText = found || cleanLine[i];
                
                if (found) {
                    btn.onclick = (e) => { showDetail(found); e.target.classList.add('read'); };
                } else {
                    btn.style.opacity = "0.4";
                    btn.onclick = () => speak(btn.innerText);
                    i++;
                }
                grid.appendChild(btn);
            }
            block.appendChild(grid);
            out.appendChild(block);
        });
        out.scrollIntoView({ behavior: 'smooth' });
    }

    function showDetail(word) {
        const entry = dictionary[word];
        document.getElementById('card-zh').innerText = word;
        document.getElementById('card-py').innerText = entry.pinyin || "";
        document.getElementById('card-en').innerText = entry.english || entry.definitions || "";
        document.getElementById('detail').classList.add('active');
        document.getElementById('mask').classList.add('active');
        speak(word);
    }

    function closeDetail() {
        document.getElementById('detail').classList.remove('active');
        document.getElementById('mask').classList.remove('active');
    }

    function speak(t) {
        const msg = new SpeechSynthesisUtterance(t || document.getElementById('card-zh').innerText);
        msg.lang = 'zh-CN';
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
