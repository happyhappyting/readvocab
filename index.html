<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Magic Pen | 多巴胺点读笔</title>
    <style>
        :root {
            --yellow: #FFEF00;
            --pink: #FF6AD5;
            --blue: #00E5FF;
            --green: #69FF94;
            --glass: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'PingFang SC', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--yellow), #FFD600);
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 磨砂玻璃容器 */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        header { width: 100%; padding: 20px 0; text-align: center; }
        h1 { margin: 0; font-size: 1.8rem; color: #333; text-shadow: 2px 2px 0px #fff; }

        .container { width: 92%; max-width: 500px; }

        /* 步骤引导 */
        .instruction {
            padding: 15px; margin-bottom: 15px;
        }
        .step-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 0.95rem; font-weight: 600; color: #444; }
        .icon-circle { 
            width: 30px; height: 30px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: white; flex-shrink: 0;
        }

        /* 拍照区 */
        .photo-btn {
            background: var(--pink); color: white;
            padding: 12px 24px; border-radius: 18px; border: none;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0px #C752A5; margin: 10px 0;
            display: inline-flex; align-items: center; gap: 8px;
        }

        /* 图片预览区 */
        .preview-box {
            width: 100%; border: 4px solid white; border-radius: 20px;
            overflow: hidden; margin: 15px 0; position: relative;
        }
        #display-img { width: 100%; height: auto; display: block; -webkit-user-select: text; }

        /* 特别指示：Show Text */
        .guide-label {
            background: #333; color: white; padding: 4px 10px; border-radius: 8px;
            font-size: 0.8rem; margin: 0 3px; display: inline-block;
        }

        /* 魔法按钮 */
        .magic-btn {
            background: var(--blue); color: white;
            padding: 18px; width: 100%; border-radius: 20px; border: none;
            font-size: 1.3rem; font-weight: 900; cursor: pointer;
            box-shadow: 0 6px 0px #00A8BB; margin: 15px 0;
            transition: all 0.1s;
        }
        .magic-btn:active { transform: translateY(4px); box-shadow: 0 2px 0px #00A8BB; }

        /* 单词按钮网格 */
        #word-grid {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 12px; padding-bottom: 150px;
        }
        .word-item {
            background: white; color: #333;
            font-size: 2.2rem; padding: 15px 25px;
            border-radius: 20px; border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes bounceIn { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }

        /* 弹出卡片 */
        #detail-view {
            position: fixed; bottom: -100%; left: 0; right: 0;
            background: white; padding: 40px 20px;
            border-radius: 35px 35px 0 0; z-index: 1000;
            text-align: center; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #detail-view.open { bottom: 0; }
        .zh-big { font-size: 5.5rem; margin: 0; color: #333; }
        .py-big { color: var(--pink); font-size: 2.2rem; font-weight: bold; margin: 5px 0; }
        .en-box { background: #F2F2F7; padding: 15px; border-radius: 15px; font-size: 1.4rem; margin: 20px 0; }
        .speak-btn {
            background: var(--green); color: #000; font-weight: 900;
            padding: 20px; width: 80%; border-radius: 25px; border: none; font-size: 1.3rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>🍭 Magic Reading Pen</h1>
    </header>

    <div class="container">
        <div class="glass-card instruction">
            <div class="step-row">
                <div class="icon-circle" style="background:var(--pink)">1</div>
                <div>拍照 / Take a Photo</div>
            </div>
            <label for="file-input" class="photo-btn">📷 Snap Photo</label>
            <input type="file" id="file-input" accept="image/*" class="hidden">
        </div>

        <div id="image-area" class="preview-box hidden">
            <img id="display-img" src="">
        </div>

        <div class="glass-card instruction">
            <div class="step-row">
                <div class="icon-circle" style="background:var(--blue)">2</div>
                <div>长按图片中你想学习的字</div>
            </div>
            <div style="font-size:0.85rem; color:#555; padding-left:40px;">
                按下 <span class="guide-label">Show Text</span> 按钮，<br>
                然后点击 <span class="guide-label">Copy</span> 拷贝文字。
            </div>
        </div>

        <button class="magic-btn" onclick="readClipboard()">🪄 出来吧！Words!</button>

        <div id="word-grid"></div>
    </div>

    <div id="detail-view">
        <button onclick="closeDetail()" style="position:absolute;top:20px;right:20px;border:none;background:none;font-size:2rem;color:#ddd;">✕</button>
        <h2 class="zh-big" id="card-zh">--</h2>
        <p class="py-big" id="card-py">--</p>
        <div class="en-box" id="card-en">--</div>
        <button class="speak-btn" onclick="speak()">🔊 听读音 (Listen)</button>
    </div>

<script>
    let dictionary = {};
    const shownSet = new Set();

    fetch('dictionary.json').then(r => r.json()).then(data => dictionary = data);

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('display-img').src = URL.createObjectURL(file);
            document.getElementById('image-area').classList.remove('hidden');
            document.getElementById('word-grid').innerHTML = "";
            shownSet.clear();
        }
    };

    async function readClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            if (text) {
                processText(text);
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } else {
                alert("Don't forget to COPY the text first! 记得先‘拷贝’文字哦！");
            }
        } catch (err) {
            alert("Tap 'Allow Paste' to play!");
        }
    }

    function processText(rawText) {
        const text = rawText.replace(/[^\u4e00-\u9fa5]/g, '');
        const grid = document.getElementById('word-grid');
        
        let i = 0;
        let count = 0;
        while (i < text.length) {
            let pair = text[i] + (text[i+1] || "");
            let found = "";

            if (dictionary[pair]) { found = pair; i += 2; } 
            else if (dictionary[text[i]]) { found = text[i]; i += 1; } 
            else { i += 1; continue; }

            if (found && !shownSet.has(found)) {
                shownSet.add(found);
                const btn = document.createElement('div');
                btn.className = 'word-item';
                btn.innerText = found;
                btn.onclick = () => showDetail(found);
                grid.appendChild(btn);
                count++;
            }
        }
    }

    function showDetail(word) {
        const entry = dictionary[word];
        if(!entry) return;
        document.getElementById('card-zh').innerText = word;
        document.getElementById('card-py').innerText = entry.pinyin;
        document.getElementById('card-en').innerText = entry.english;
        document.getElementById('detail-view').classList.add('open');
        speak(word);
    }

    function closeDetail() { document.getElementById('detail-view').classList.remove('open'); }

    function speak(t) {
        const text = t || document.getElementById('card-zh').innerText;
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-CN';
        msg.rate = 0.7;
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
