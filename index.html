<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Magic Pen | 华文点读宝</title>
    <style>
        :root {
            --yellow: #FFEF00;
            --pink: #FF6AD5;
            --blue: #007AFF; /* 加深后的苹果标准蓝色 */
            --blue-dark: #0056B3; /* 按钮阴影颜色 */
            --green: #34C759;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: 'PingFang SC', system-ui, sans-serif;
            background: linear-gradient(160deg, var(--yellow), #FFD600);
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 磨砂玻璃卡片 */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        header { width: 100%; padding: 25px 0 10px; text-align: center; }
        h1 { margin: 0; font-size: 1.8rem; color: #333; letter-spacing: 1px; }

        .container { width: 92%; max-width: 500px; padding-bottom: 120px; }

        /* 步骤引导 */
        .instruction-box { padding: 20px; margin-bottom: 15px; }
        .step-header { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 1.1rem; margin-bottom: 12px; }
        
        .gesture-guide {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            background: rgba(0,0,0,0.04); padding: 12px; border-radius: 15px;
        }
        .action-item { display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 0.8rem; font-weight: bold; color: #444; }
        .hand-icon { font-size: 1.8rem; margin-bottom: 5px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        .label-black { background: #333; color: white; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; }

        /* 拍照按钮 */
        .photo-btn {
            background: var(--pink); color: white; border: none; padding: 15px;
            border-radius: 20px; font-size: 1.1rem; font-weight: 900;
            box-shadow: 0 5px 0px #D645AB; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .preview-box { width: 100%; border: 6px solid white; border-radius: 25px; overflow: hidden; margin: 15px 0; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        #display-img { width: 100%; height: auto; display: block; -webkit-user-select: text !important; user-select: text !important; }

        /* 🪄 变色后的深蓝色魔法按钮 */
        .magic-btn {
            background: var(--blue); 
            color: white; 
            border: none; 
            padding: 22px; 
            width: 100%; 
            border-radius: 24px; 
            font-size: 1.6rem; /* 稍微调大了一点 */
            font-weight: 900;
            box-shadow: 0 8px 0px var(--blue-dark); /* 深色立体阴影 */
            margin: 20px 0; 
            transition: all 0.1s;
            cursor: pointer;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .magic-btn:active { 
            transform: translateY(4px); 
            box-shadow: 0 4px 0px var(--blue-dark); 
        }

        /* 词语展示网格 */
        #word-grid { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 12px; margin-top: 10px; }
        .word-item {
            background: white; color: #333; font-size: 2.1rem; padding: 14px 22px;
            border-radius: 20px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: all 0.2s;
        }
        .word-item.read { background: #eee !important; color: #bbb !important; transform: scale(0.9); }

        /* 解释卡片 */
        #detail-view {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -40%) scale(0.9);
            width: 80%; max-width: 340px; padding: 40px 25px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 2px solid white; border-radius: 40px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.25);
            z-index: 2000; text-align: center;
            opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #detail-view.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

        .zh-text { font-size: 5.5rem; margin: 0; color: #222; font-weight: 900; }
        .py-text { color: #FF00A0; font-size: 1.8rem; font-weight: bold; margin: 5px 0 15px; }
        .en-text { font-size: 1.3rem; color: #555; background: rgba(0,0,0,0.04); padding: 15px; border-radius: 18px; margin-bottom: 25px; line-height: 1.3; }
        
        .speak-btn { background: var(--green); color: white; font-weight: 900; padding: 18px; width: 100%; border-radius: 20px; border: none; font-size: 1.2rem; }
        .close-btn { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #555; color: white; border: none; border-radius: 50%; font-size: 1.5rem; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 1500; opacity: 0; pointer-events: none; transition: 0.3s; }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>✨ 华文点读宝</h1>
    </header>

    <div class="container">
        <div class="glass instruction-box">
            <div class="step-header">📸 Step 1: 拍张照片</div>
            <label for="file-input" class="photo-btn">打开相机 Take Photo</label>
            <input type="file" id="file-input" accept="image/*" class="hidden">
        </div>

        <div id="image-area" class="preview-box hidden">
            <img id="display-img" src="">
        </div>

        <div class="glass instruction-box">
            <div class="step-header">👆 Step 2: 选出文字</div>
            <div class="gesture-guide">
                <div class="action-item">
                    <div class="hand-icon">👆</div>
                    手指按住字不要动<br><small>(Press & Hold)</small>
                </div>
                <div class="action-item">
                    <div class="hand-icon">🔘</div>
                    点 <span class="label-black">Show Text</span><br>再点 <span class="label-black">Copy</span>
                </div>
            </div>
        </div>

        <button class="magic-btn" onclick="readClipboard()">🪄 变出词语！Magic!</button>

        <div id="word-grid"></div>
    </div>

    <div id="mask" class="overlay" onclick="closeDetail()"></div>

    <div id="detail-view">
        <button onclick="closeDetail()" class="close-btn">✕</button>
        <h2 class="zh-text" id="card-zh">--</h2>
        <p class="py-text" id="card-py">--</p>
        <div class="en-text" id="card-en">--</div>
        <button class="speak-btn" onclick="speak()">🔊 听读音 Listen</button>
    </div>

<script>
    let dictionary = {};

    fetch('dictionary.json')
        .then(r => r.json())
        .then(data => { dictionary = data; });

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('display-img').src = URL.createObjectURL(file);
            document.getElementById('image-area').classList.remove('hidden');
            document.getElementById('word-grid').innerHTML = "";
            setTimeout(() => {
                document.getElementById('image-area').scrollIntoView({ behavior: 'smooth' });
            }, 300);
        }
    };

    async function readClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            if (text && text.trim().length > 0) {
                processText(text);
            } else {
                alert("记得先长按图片‘拷贝’文字哦！\nCopy the text first!");
            }
        } catch (err) {
            alert("Please allow Paste to see words!");
        }
    }

    function processText(rawText) {
        const text = rawText.replace(/[^\u4e00-\u9fa5]/g, '');
        const grid = document.getElementById('word-grid');
        grid.innerHTML = "";
        
        let i = 0;
        const maxLen = 7; 

        while (i < text.length) {
            let found = "";
            for (let len = maxLen; len >= 1; len--) {
                let chunk = text.substr(i, len);
                if (dictionary[chunk]) {
                    found = chunk;
                    i += len;
                    break;
                }
            }
            if (found) {
                createButton(found, true, grid);
            } else {
                createButton(text[i], false, grid);
                i++;
            }
        }
        setTimeout(() => {
            grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    }

    function createButton(word, isInDict, container) {
        const btn = document.createElement('div');
        btn.className = 'word-item';
        btn.innerText = word;
        if (isInDict) {
            btn.onclick = (e) => {
                showDetail(word);
                e.target.classList.add('read');
            };
        } else {
            btn.style.opacity = "0.4";
            btn.onclick = () => speak(word);
        }
        container.appendChild(btn);
    }

    function showDetail(word) {
        const entry = dictionary[word];
        if(!entry) return;
        document.getElementById('card-zh').innerText = word;
        document.getElementById('card-py').innerText = entry.pinyin || "";
        document.getElementById('card-en').innerText = entry.english || entry.definitions || "";
        document.getElementById('detail-view').classList.add('active');
        document.getElementById('mask').classList.add('active');
        speak(word);
    }

    function closeDetail() { 
        document.getElementById('detail-view').classList.remove('active'); 
        document.getElementById('mask').classList.remove('active');
    }

    function speak(t) {
        const text = t || document.getElementById('card-zh').innerText;
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-CN';
        msg.rate = 0.7;
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
