<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Pen Pro</title>
    <style>
        body { font-family: system-ui; background: #FFF9C4; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; }
        
        /* 💡 关键：让图片处于最简单的状态 */
        #display-img { 
            width: 100%; height: auto; display: block; 
            margin: 20px 0; border-radius: 12px;
            /* 强制开启系统底层权限 */
            -webkit-user-select: text !important;
            user-select: text !important;
            -webkit-touch-callout: default !important;
        }

        .card { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-pink { background: #FF66A1; color: white; border: none; width: 100%; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; box-shadow: 0 5px 0 #D1457A; }
        .btn-blue { background: #007AFF; color: white; border: none; width: 100%; padding: 20px; border-radius: 15px; font-size: 1.4rem; font-weight: bold; box-shadow: 0 5px 0 #0056B3; margin: 15px 0; }
        .btn-pink:active, .btn-blue:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }

        .paragraph-wrapper { position: relative; margin-bottom: 25px; padding: 15px; background: rgba(255,255,255,0.5); border-radius: 15px; }
        .paragraph-num { background: #333; color: white; padding: 2px 8px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 10px; display: inline-block; }
        .word-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .word-item { background: white; padding: 12px 18px; border-radius: 12px; font-size: 1.8rem; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .word-item.read { background: #E5E5EA; color: #AEAEB2; }

        #detail-view { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; background: white; border-radius: 30px; padding: 30px; z-index: 2000; text-align: center; display: none; box-shadow: 0 0 100px rgba(0,0,0,0.3); }
        #detail-view.active { display: block; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 1500; display: none; }
        .overlay.active { display: block; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <b style="display:block; margin-bottom:10px;">01. 拍照</b>
        <label for="file-input" class="btn-pink">打开相机 Take Photo</label>
        <input type="file" id="file-input" accept="image/*" class="hidden">
    </div>

    <img id="display-img" class="hidden">

    <div class="card">
        <b style="display:block; margin-bottom:10px;">02. 选词指引</b>
        <p style="font-size:0.9rem; margin:0;">1. 长按上方图片中文字<br>2. 点击 <b>Show Text</b> -> <b>Copy</b></p>
    </div>

    <button class="btn-blue" onclick="readClipboard()">分析 Analyze</button>
    <div id="result-area"></div>
</div>

<div id="mask" class="overlay" onclick="closeDetail()"></div>
<div id="detail-view">
    <h2 id="card-zh" style="font-size:4rem; margin:0;"></h2>
    <p id="card-py" style="color:#FF66A1; font-size:1.5rem;"></p>
    <div id="card-en" style="background:#f2f2f7; padding:15px; border-radius:15px; margin:15px 0;"></div>
    <button onclick="speak()" style="background:#34C759; color:white; width:100%; padding:15px; border:none; border-radius:12px; font-weight:bold;">🔊 听读音</button>
</div>

<script>
    let dictionary = {};
    fetch('dictionary.json').then(r => r.json()).then(data => {
        dictionary = data;
        const saved = localStorage.getItem('last_scan');
        if(saved) processText(saved);
    });

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const img = document.getElementById('display-img');
            img.src = URL.createObjectURL(file);
            img.classList.remove('hidden');
            img.scrollIntoView({ behavior: 'smooth' });
        }
    };

    async function readClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            if (text.trim()) {
                processText(text);
                localStorage.setItem('last_scan', text);
            }
        } catch (err) { alert("请允许粘贴权限"); }
    }

    function processText(rawText) {
        const grid = document.getElementById('result-area');
        grid.innerHTML = "";
        const paragraphs = rawText.split(/\n+/);
        paragraphs.forEach((pText, index) => {
            const clean = pText.replace(/[^\u4e00-\u9fa5]/g, '');
            if (!clean) return;
            const wrapper = document.createElement('div');
            wrapper.className = 'paragraph-wrapper';
            wrapper.innerHTML = `<span class="paragraph-num">P${index+1}</span>`;
            const content = document.createElement('div');
            content.className = 'word-grid';
            
            let i = 0;
            while (i < clean.length) {
                let found = "";
                for (let len = 7; len >= 1; len--) {
                    let chunk = clean.substr(i, len);
                    if (dictionary[chunk]) { found = chunk; i += len; break; }
                }
                const btn = document.createElement('div');
                btn.className = 'word-item';
                btn.innerText = found || clean[i];
                if (found) btn.onclick = (e) => { showDetail(found); e.target.classList.add('read'); };
                else { btn.style.opacity = "0.4"; btn.onclick = () => speak(btn.innerText); i++; }
                content.appendChild(btn);
            }
            wrapper.appendChild(content);
            grid.appendChild(wrapper);
        });
    }

    function showDetail(word) {
        const entry = dictionary[word];
        document.getElementById('card-zh').innerText = word;
        document.getElementById('card-py').innerText = entry.pinyin || "";
        document.getElementById('card-en').innerText = entry.english || entry.definitions || "";
        document.getElementById('detail-view').classList.add('active');
        document.getElementById('mask').classList.add('active');
        speak(word);
    }

    function closeDetail() { document.getElementById('detail-view').classList.remove('active'); document.getElementById('mask').classList.remove('active'); }
    function speak(t) {
        const msg = new SpeechSynthesisUtterance(t || document.getElementById('card-zh').innerText);
        msg.lang = 'zh-CN';
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
