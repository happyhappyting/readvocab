<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Smart Pen | 智能阅读助手</title>
    <style>
        :root {
            --bg-yellow: #FFF9C4; 
            --card-white: #FFFFFF;
            --action-pink: #FF66A1; 
            --pink-shadow: #D1457A;
            --vivid-blue: #007AFF;
            --blue-shadow: #0056B3;
            --success-green: #34C759;
            --text-main: #1C1C1E;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg-yellow);
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-main);
        }

        header { width: 100%; padding: 25px 0 10px; text-align: center; }
        h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: 1px; }

        .container { width: 92%; max-width: 500px; padding-bottom: 150px; }

        .glass-card {
            background: var(--card-white);
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            padding: 22px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .step-header { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; margin-bottom: 15px; }

        /* --- 拍照指引样式 --- */
        .instruction-grid { display: grid; grid-template-columns: 40px 1fr; gap: 15px; margin-top: 10px; }
        .icon-wrap { display: flex; justify-content: center; align-items: center; font-size: 1.8rem; color: var(--action-pink); }
        .text-title { font-weight: 700; font-size: 0.95rem; color: #333; }
        .text-title-en { font-weight: 700; font-size: 0.9rem; color: #555; margin-bottom: 2px; }
        .text-detail { font-size: 0.8rem; color: #666; line-height: 1.4; }
        .label-black { background: #333; color: white; padding: 2px 5px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }

        /* --- 编辑区样式 --- */
        #text-input {
            width: 100%; height: 140px;
            border-radius: 18px; border: 2px solid #EEE;
            padding: 15px; font-size: 1.1rem; font-family: inherit;
            resize: none; outline: none; transition: border 0.3s;
            background: #FAFAFA; line-height: 1.5;
        }
        #text-input:focus { border-color: var(--vivid-blue); background: #FFF; }
        .btn-group { display: flex; gap: 10px; margin-top: 12px; }
        .sub-btn { flex: 1; padding: 12px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: 0.1s; }
        .btn-paste { background: #EEE; color: #333; }
        .btn-clear { background: #FFE5E5; color: #FF3B30; }

        .magic-btn {
            background: var(--vivid-blue); color: white; border: none;
            width: 100%; padding: 22px; border-radius: 22px;
            font-size: 1.4rem; font-weight: 800;
            box-shadow: 0 8px 0px var(--blue-shadow);
            margin: 20px 0; cursor: pointer; transition: all 0.1s;
        }
        .magic-btn:active { transform: translateY(4px); box-shadow: 0 4px 0px var(--blue-shadow); }

        /* --- 分词展示区 --- */
        .paragraph-row { display: flex; flex-wrap: wrap; gap: 12px; background: rgba(255,255,255,0.4); padding: 15px; border-radius: 18px; margin-bottom: 20px; }
        .word-item { background: white; color: var(--text-main); font-size: 2rem; font-weight: 700; padding: 14px 22px; border-radius: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .word-item.read { background: #E5E5EA !important; color: #AEAEB2 !important; }

        /* --- 弹窗 --- */
        #detail-view {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -40%) scale(0.9);
            width: 85%; max-width: 350px; padding: 40px 25px;
            background: white; border-radius: 40px; z-index: 2000; text-align: center;
            opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #detail-view.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 1500; opacity: 0; pointer-events: none; transition: 0.3s; }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .zh-text { font-size: 5rem; margin: 0; font-weight: 900; }
        .py-text { color: var(--action-pink); font-size: 1.8rem; font-weight: 700; margin: 10px 0 20px; }
        .en-text { font-size: 1.2rem; color: #444; background: #F2F2F7; padding: 18px; border-radius: 18px; margin-bottom: 25px; line-height: 1.4; }
        .speak-btn { background: var(--success-green); color: white; font-weight: 800; padding: 20px; width: 100%; border-radius: 20px; border: none; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header><h1>Smart Pen</h1></header>

    <div class="container">
        <div class="glass-card">
            <div class="step-header">📸 第一步: 拍照识字 (OCR)</div>
            <div class="instruction-grid">
                <div class="icon-wrap">📱</div>
                <div class="text-wrap">
                    <div class="text-title">1. 打开系统相机 App</div>
                    <div class="text-title-en">Open iPad Camera App</div>
                    <div class="text-detail">对准课本文字。 (Point at the Chinese text.)</div>
                </div>
                <div class="icon-wrap">三</div>
                <div class="text-wrap">
                    <div class="text-title">2. 点击文字识别图标</div>
                    <div class="text-title-en">Tap Live Text Icon</div>
                    <div class="text-detail">等待文字高亮。 (Wait for text highlight.)</div>
                </div>
                <div class="icon-wrap">📋</div>
                <div class="text-wrap">
                    <div class="text-title">3. 拷贝全部文字</div>
                    <div class="text-title-en">Tap "Copy All"</div>
                    <div class="text-detail">点击左下角的 <span class="label-black">拷贝全部 (Copy All)</span>。</div>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <div class="step-header">📝 第二步: 准备内容 (Prepare)</div>
            <textarea id="text-input" placeholder="文字将在这里显示，你可以手动修改..."></textarea>
            <div class="btn-group">
                <button class="sub-btn btn-paste" onclick="appendClipboard()">📋 追加粘贴 (Paste)</button>
                <button class="sub-btn btn-clear" onclick="clearText()">🗑️ 清空 (Clear)</button>
            </div>
            <button class="magic-btn" onclick="startAnalyze()">开始分析 Analyze</button>
        </div>

        <div id="word-grid"></div>
    </div>

    <div id="mask" class="overlay" onclick="closeDetail()"></div>
    <div id="detail-view">
        <h2 class="zh-text" id="card-zh">--</h2>
        <p class="py-text" id="card-py">--</p>
        <div class="en-text" id="card-en">--</div>
        <button class="speak-btn" onclick="speak()">🔊 播放读音 (Listen)</button>
    </div>

<script>
    // --- 完整、无删减的高频词库 ---
    const priorityVocab = {
        "那儿": { pinyin: "nàr", english: "there / that place" },
        "这儿": { pinyin: "zhèr", english: "here / this place" },
        "在哪儿": { pinyin: "zài nǎr", english: "at where / where is it?" },
        "那里": { pinyin: "nàlǐ", english: "there / that place" },
        "这里": { pinyin: "zhèlǐ", english: "here / this place" },
        "但是": { pinyin: "dànshì", english: "but / however" },
        "因为": { pinyin: "yīnwèi", english: "because" },
        "所以": { pinyin: "suǒyǐ", english: "therefore / so" },
        "如果": { pinyin: "rúguǒ", english: "if / in case" },
        "而且": { pinyin: "érqiě", english: "moreover / furthermore / and also" },
        "虽然": { pinyin: "suīrán", english: "although / though" },
        "还是": { pinyin: "háishi", english: "still / or (in a question)" },
        "然后": { pinyin: "ránhòu", english: "then / afterwards" },
        "或者": { pinyin: "huòzhě", english: "or / possibly" },
        "可是": { pinyin: "kěshì", english: "but / however" },
        "只要": { pinyin: "zhǐyào", english: "as long as / only if" },
        "可": { pinyin: "kě", english: "can / able to (Commonly: 可以 kěyǐ)" },
        "着": { pinyin: "zhe", english: "indicates action in progress (Commonly: 看着 kànzhe)" },
        "了": { pinyin: "le", english: "completed action / change of state" },
        "和": { pinyin: "hé", english: "and / with" },
        "的": { pinyin: "de", english: "possessive particle" },
        "地": { pinyin: "de", english: "-ly (adverb marker) / dì: ground" },
        "得": { pinyin: "de", english: "resultative particle / děi: must" },
        "就": { pinyin: "jiù", english: "then / precisely / right away" },
        "也": { pinyin: "yě", english: "also / too" },
        "要": { pinyin: "yào", english: "want / will / must" },
        "而": { pinyin: "ér", english: "and / but" },
        "但": { pinyin: "dàn", english: "but" },
        "为": { pinyin: "wèi", english: "for / because of / wéi: to be" },
        "子": { pinyin: "zi", english: "noun suffix / child" },
        "会": { pinyin: "huì", english: "can / will / meet" },
        "在": { pinyin: "zài", english: "at / in / located at" },
        "是": { pinyin: "shì", english: "is / am / are / yes" },
        "后": { pinyin: "hòu", english: "after / behind / back" },
        "已经": { pinyin: "yǐjīng", english: "already" },
        "准备": { pinyin: "zhǔnbèi", english: "prepare" },
        "开始": { pinyin: "kāishǐ", english: "start" }
    };

    let mainDictionary = {};
    fetch('dictionary.json').then(r => r.json()).then(data => mainDictionary = data);

    async function appendClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            if (text) {
                const editor = document.getElementById('text-input');
                const separator = editor.value.length > 0 ? "\n" : "";
                editor.value += separator + text;
            }
        } catch (err) { alert("请允许粘贴权限。"); }
    }

    function clearText() {
        if(confirm("确定清空吗？")) {
            document.getElementById('text-input').value = "";
            document.getElementById('word-grid').innerHTML = "";
        }
    }

    function startAnalyze() {
        const text = document.getElementById('text-input').value;
        if (text.trim()) processText(text);
    }

    function processText(rawText) {
        const grid = document.getElementById('word-grid');
        grid.innerHTML = "";
        const paragraphs = rawText.split(/\n+/);
        paragraphs.forEach(pText => {
            const cleanText = pText.replace(/[^\u4e00-\u9fa5]/g, '');
            if (cleanText.length === 0) return;
            const row = document.createElement('div');
            row.className = 'paragraph-row';
            let i = 0;
            while (i < cleanText.length) {
                let found = "";
                for (let len = 7; len >= 1; len--) {
                    let chunk = cleanText.substr(i, len);
                    if (priorityVocab[chunk] || mainDictionary[chunk]) {
                        found = chunk; i += len; break;
                    }
                }
                if (found) { addWordItem(found, true, row); } 
                else { addWordItem(cleanText[i], false, row); i++; }
            }
            grid.appendChild(row);
        });
        setTimeout(() => grid.scrollIntoView({ behavior: 'smooth' }), 100);
    }

    function addWordItem(word, isInDict, container) {
        const btn = document.createElement('div');
        btn.className = 'word-item';
        btn.innerText = word;
        if (isInDict) {
            btn.onclick = (e) => { showDetail(word); e.target.classList.add('read'); };
        } else {
            btn.style.opacity = "0.3"; btn.onclick = () => speak(word);
        }
        container.appendChild(btn);
    }

    function showDetail(word) {
        const entry = priorityVocab[word] || mainDictionary[word];
        document.getElementById('card-zh').innerText = word;
        document.getElementById('card-py').innerText = entry.pinyin || entry.pronunciation || "";
        document.getElementById('card-en').innerText = entry.english || entry.definitions || "";
        document.getElementById('detail-view').classList.add('active');
        document.getElementById('mask').classList.add('active');
        speak(word);
    }

    function closeDetail() { 
        document.getElementById('detail-view').classList.remove('active'); 
        document.getElementById('mask').classList.remove('active');
    }

    function speak(t) {
        const text = t || document.getElementById('card-zh').innerText;
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-CN';
        msg.rate = 0.8;
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
