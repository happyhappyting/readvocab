<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>iPad网页点读笔</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <!-- Tesseract.js OCR库 -->
    <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <header>
            <h1><i class="fas fa-book-reader"></i> 网页点读笔</h1>
            <p class="subtitle">拍照 → 识别 → 点击学习</p>
        </header>

        <!-- 步骤指示器 -->
        <div class="steps">
            <div class="step active" id="step1">1. 拍照</div>
            <div class="step" id="step2">2. 识别</div>
            <div class="step" id="step3">3. 点读</div>
        </div>

        <!-- 主内容区 -->
        <main>
            <!-- 拍照区域 -->
            <section id="camera-section" class="section active">
                <div class="camera-container">
                    <video id="camera" autoplay playsinline></video>
                    <div class="focus-guide">
                        <div class="frame"></div>
                        <p>将文字放入框内</p>
                    </div>
                </div>
                <div class="controls">
                    <button id="capture-btn" class="btn-primary">
                        <i class="fas fa-camera"></i> 拍照识别
                    </button>
                    <button id="switch-camera" class="btn-secondary">
                        <i class="fas fa-sync-alt"></i> 切换摄像头
                    </button>
                </div>
            </section>

            <!-- 识别结果区域 -->
            <section id="text-section" class="section">
                <div class="result-header">
                    <h3>识别结果</h3>
                    <button id="back-to-camera" class="btn-small">
                        <i class="fas fa-redo"></i> 重新拍照
                    </button>
                </div>
                <div class="text-display" id="recognized-text">
                    <!-- 文字会动态插入到这里 -->
                </div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>正在识别文字...</p>
                </div>
            </section>

            <!-- 词语详情区域 -->
            <section id="word-detail" class="section">
                <div class="detail-header">
                    <h3>词语学习</h3>
                    <button id="back-to-text" class="btn-small">
                        <i class="fas fa-arrow-left"></i> 返回
                    </button>
                </div>
                <div class="word-card">
                    <div class="word-display">
                        <h2 id="current-word">苹果</h2>
                        <p class="pinyin" id="word-pinyin">píng guǒ</p>
                    </div>
                    <div class="word-controls">
                        <button id="speak-btn" class="btn-icon">
                            <i class="fas fa-volume-up"></i> 发音
                        </button>
                        <button id="record-btn" class="btn-icon">
                            <i class="fas fa-microphone"></i> 跟读
                        </button>
                    </div>
                    <div class="word-info">
                        <h4><i class="fas fa-book"></i> 解释</h4>
                        <p id="word-meaning">一种常见水果，圆形，味道甜...</p>
                        <h4><i class="fas fa-comment"></i> 例句</h4>
                        <p id="word-example">我喜欢吃<mark>苹果</mark>。</p>
                        <h4><i class="fas fa-history"></i> 学习记录</h4>
                        <p>已学习 <span id="learn-count">3</span> 次</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- 生词本 -->
        <aside class="vocab-sidebar">
            <h3><i class="fas fa-bookmark"></i> 生词本</h3>
            <div class="vocab-list" id="vocab-list">
                <p class="empty-tip">点击词语会自动添加到这里</p>
            </div>
            <button id="clear-vocab" class="btn-small">清空生词本</button>
        </aside>

        <!-- 使用提示 -->
        <div class="tips">
            <p><i class="fas fa-lightbulb"></i> 提示：添加到主屏幕可获得更好的体验</p>
        </div>
    </div>

    <!-- 录音指示器 -->
    <div id="recording-indicator" class="recording-indicator">
        <div class="pulse"></div>
        <p>正在录音... 请跟读</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
