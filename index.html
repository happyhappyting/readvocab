<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Smart Pen | 智能阅读助手</title>
    <style>
        :root {
            --bg-yellow: #FFF9C4; 
            --card-white: #FFFFFF;
            --action-pink: #FF66A1; 
            --pink-shadow: #D1457A;
            --vivid-blue: #007AFF;
            --blue-shadow: #0056B3;
            --success-green: #34C759;
            --text-main: #1C1C1E;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg-yellow);
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-main);
        }

        header { width: 100%; padding: 30px 0 10px; text-align: center; }
        h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: 1px; }

        .container { width: 92%; max-width: 500px; padding-bottom: 150px; }

        .glass-card {
            background: var(--card-white);
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            margin-bottom: 20px; padding: 22px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .step-header { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; margin-bottom: 15px; }

        .photo-btn {
            background: var(--action-pink); color: white; border: none;
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 18px; border-radius: 20px; font-size: 1.1rem; font-weight: 700;
            box-shadow: 0 6px 0px var(--pink-shadow);
            cursor: pointer; transition: all 0.1s;
        }
        .photo-btn:active { transform: translateY(4px); box-shadow: 0 2px 0px var(--pink-shadow); }

        /* 📸 图片区域：绝对扁平，不使用复杂容器，确保 Live Text 菜单弹出 */
        #display-img { 
            width: 100%; height: auto; display: block; 
            border: 6px solid white; border-radius: 20px;
            margin: 20px 0; box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            -webkit-user-select: text !important; 
            user-select: text !important;
            -webkit-touch-callout: default !important;
        }

        .gesture-guide {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            background: #F2F2F7; padding: 15px; border-radius: 18px;
        }
        .action-item { display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 0.85rem; font-weight: 700; color: #444; }
        .label-black { background: #333; color: white; padding: 2px 6px; border-radius: 5px; font-size: 0.7rem; font-weight: normal; }

        .magic-btn {
            background: var(--vivid-blue); color: white; border: none;
            width: 100%; padding: 22px; border-radius: 22px;
            font-size: 1.4rem; font-weight: 800;
            box-shadow: 0 8px 0px var(--blue-shadow);
            margin: 20px 0; cursor: pointer; transition: all 0.1s;
        }
        .magic-btn:active { transform: translateY(4px); box-shadow: 0 4px 0px var(--blue-shadow); }

        /* --- 段落升级样式 --- */
        #word-grid { display: block; width: 100%; }
        
        .paragraph-container {
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 25px 15px 15px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.6);
        }
        
        /* 段落编号 */
        .p-badge {
            position: absolute; top: -10px; left: 15px;
            background: #222; color: white;
            padding: 2px 10px; border-radius: 8px;
            font-size: 0.8rem; font-weight: 800;
        }

        .p-content { display: flex; flex-wrap: wrap; gap: 12px; }

        .word-item {
            background: white; color: var(--text-main); font-size: 1.8rem; font-weight: 700; padding: 12px 18px;
            border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        .word-item.read { background: #E5E5EA !important; color: #AEAEB2 !important; transform: scale(0.95); }

        /* 解释弹窗 */
        #detail-view {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%; -40%) scale(0.9);
            width: 85%; max-width: 350px; padding: 40px 25px;
            background: #FFFFFF; border-radius: 40px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.2);
            z-index: 2000; text-align: center;
            opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #detail-view.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

        .zh-text { font-size: 5rem; margin: 0; color: #000; font-weight: 900; }
        .py-text { color: var(--action-pink); font-size: 1.8rem; font-weight: 700; margin: 10px 0 20px; }
        .en-text { font-size: 1.1rem; color: #444; background: #F2F2F7; padding: 18px; border-radius: 18px; margin-bottom: 25px; line-height: 1.4; }
        
        .speak-btn { background: var(--success-green); color: white; font-weight: 800; padding: 20px; width: 100%; border-radius: 20px; border: none; font-size: 1.2rem; }
        .close-btn { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background: #E5E5EA; color: #8E8E93; border: none; border-radius: 50%; font-size: 1.2rem; font-weight: bold; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 1500; opacity: 0; pointer-events: none; transition: 0.3s; }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>Smart Pen</h1>
    </header>

    <div class="container">
        
        <div class="glass-card">
            <div class="step-header">📸 01. 导入内容</div>
            <label for="file-input" class="photo-btn">打开相机 / 选取图片</label>
            <input type="file" id="file-input" accept="image/*" class="hidden">
        </div>

        <img id="display-img" class="hidden">

        <div class="glass-card">
            <div class="step-header">👆 02. 选取词语</div>
            <div class="gesture-guide">
                <div class="action-item">长按文字并拷贝</div>
                <div class="action-item">点 <span class="label-black">Show Text</span></div>
            </div>
        </div>

        <button class="magic-btn" onclick="readClipboard()">分析 Analyze</button>

        <div id="word-grid"></div>
    </div>

    <div id="mask" class="overlay" onclick="closeDetail()"></div>
    <div id="detail-view">
        <button onclick="closeDetail()" class="close-btn">✕</button>
        <h2 class="zh-text" id="card-zh">--</h2>
        <p class="py-text" id="card-py">--</p>
        <div class="en-text" id="card-en">--</div>
        <button class="speak-btn" onclick="speak()">🔊 播放 (Listen)</button>
    </div>

<script>
    let dictionary = {};
    fetch('dictionary.json').then(r => r.json()).then(data => dictionary = data);

    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const img = document.getElementById('display-img');
            img.src = URL.createObjectURL(file);
            img.classList.remove('hidden');
            img.scrollIntoView({ behavior: 'smooth' });
        }
    };

    async function readClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            if (text && text.trim()) {
                processText(text);
            } else {
                alert("记得先拷贝图片里的文字哦！");
            }
        } catch (err) { alert("请授予粘贴权限"); }
    }

    function processText(rawText) {
        const grid = document.getElementById('word-grid');
        grid.innerHTML = "";
        
        // 1. 先按换行符切分段落
        const paragraphs = rawText.split(/\n+/);
        let pIndex = 1;

        paragraphs.forEach(pText => {
            // 2. 提取段落内中文
            const cleanText = pText.replace(/[^\u4e00-\u9fa5]/g, '');
            if (cleanText.length === 0) return;

            // 3. 创建段落容器
            const container = document.createElement('div');
            container.className = 'paragraph-container';
            container.innerHTML = `<div class="p-badge">P${pIndex++}</div>`;
            
            const content = document.createElement('div');
            content.className = 'p-content';
            
            let i = 0;
            while (i < cleanText.length) {
                let found = "";
                for (let len = 7; len >= 1; len--) {
                    let chunk = cleanText.substr(i, len);
                    if (dictionary[chunk]) { found = chunk; i += len; break; }
                }
                if (found) {
                    addWordItem(found, true, content);
                } else {
                    addWordItem(cleanText[i], false, content);
                    i++;
                }
            }
            container.appendChild(content);
            grid.appendChild(container);
        });

        setTimeout(() => { grid.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
    }

    function addWordItem(word, isInDict, container) {
        const btn = document.createElement('div');
        btn.className = 'word-item';
        btn.innerText = word;
        if (isInDict) {
            btn.onclick = (e) => { showDetail(word); e.target.classList.add('read'); };
        } else {
            btn.style.opacity = "0.4"; btn.style.border = "1px dashed #999";
            btn.onclick = () => speak(word);
        }
        container.appendChild(btn);
    }

    function showDetail(word) {
        const entry = dictionary[word];
        document.getElementById('card-zh').innerText = word;
        document.getElementById('card-py').innerText = entry.pinyin || "";
        document.getElementById('card-en').innerText = entry.english || entry.definitions || "";
        document.getElementById('detail-view').classList.add('active');
        document.getElementById('mask').classList.add('active');
        speak(word);
    }

    function closeDetail() { 
        document.getElementById('detail-view').classList.remove('active'); 
        document.getElementById('mask').classList.remove('active');
    }

    function speak(t) {
        const msg = new SpeechSynthesisUtterance(t || document.getElementById('card-zh').innerText);
        msg.lang = 'zh-CN';
        msg.rate = 0.8;
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
