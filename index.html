<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Smart Reading Pen</title>
    <script src="https://unpkg.com/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
    <style>
        :root { --primary: #007aff; --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); padding-bottom: 120px; }
        .hidden { display: none !important; }
        
        header { text-align: center; margin-bottom: 25px; }
        .subtitle { font-size: 0.9rem; color: #8e8e93; margin-top: 5px; }

        /* Camera Button */
        .btn-scan { 
            background: var(--primary); color: white; border: none; padding: 22px; 
            border-radius: 18px; font-size: 1.3rem; font-weight: 600; width: 100%; 
            box-shadow: 0 4px 15px rgba(0,122,255,0.3); cursor: pointer; display: block; text-align: center;
        }

        /* Results Grid */
        .word-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 25px 0; }
        .word-btn { 
            font-size: 2.2rem; padding: 15px 20px; background: white; border-radius: 15px; 
            border: 1px solid #d1d1d6; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer;
        }

        /* History Section */
        .history-container { margin-top: 40px; border-top: 1px solid #d1d1d6; padding-top: 20px; }
        .history-item { 
            background: white; margin-bottom: 10px; padding: 15px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 6px solid var(--primary); animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        /* Detail Sheet */
        #detail-view { 
            position: fixed; bottom: 0; left: 0; right: 0; background: white; 
            padding: 35px 25px; border-radius: 25px 25px 0 0; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15); text-align: center; z-index: 100;
        }
        .pinyin { color: var(--primary); font-size: 1.6rem; font-weight: bold; margin: 10px 0; }
        .english { color: #636366; font-size: 1.2rem; margin-bottom: 20px; line-height: 1.4; }

        /* Loading */
        #loading { text-align: center; padding: 30px; }
        .spinner { width: 35px; height: 35px; border: 4px solid #e5e5ea; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0;">点读笔</h1>
        <div class="subtitle">Scan Text → Tap to Learn English</div>
    </header>

    <main>
        <label for="camera-input" class="btn-scan">
            📷 Take Photo / 拍照识别
        </label>
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Cleaning image & Reading...<br>画质增强中...</p>
        </div>

        <canvas id="proc-canvas" class="hidden"></canvas>

        <div id="word-grid" class="word-grid"></div>

        <div class="history-container">
            <h3 style="margin-bottom:15px;">学习记录 <small style="color:#8e8e93; font-weight:normal;">History</small></h3>
            <div id="history-list">
                </div>
        </div>
    </main>

    <div id="detail-view" class="hidden">
        <button onclick="closeDetail()" style="position:absolute; top:15px; right:20px; border:none; background:none; font-size:1.8rem; color:#c7c7cc;">✕</button>
        <h2 id="zh-text" style="font-size:4.5rem; margin:0;">--</h2>
        <p id="py-text" class="pinyin">--</p>
        <p id="en-text" class="english">--</p>
        <button class="btn-scan" onclick="speakNow()">🔊 Listen / 听发音</button>
    </div>

<script>
    let dictionary = {};
    const historyData = new Set(); // Prevent duplicates in one session

    // Initialize Dictionary
    fetch('dictionary.json')
        .then(r => r.json())
        .then(data => dictionary = data)
        .catch(() => console.error("Could not load dictionary.json"));

    const cameraInput = document.getElementById('camera-input');
    const canvas = document.getElementById('proc-canvas');
    const ctx = canvas.getContext('2d');

    cameraInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('word-grid').innerHTML = "";

        // Pre-process image for Tesseract
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = async () => {
            canvas.width = img.width;
            canvas.height = img.height;
            // High contrast B&W filter helps OCR accuracy immensely
            ctx.filter = 'grayscale(1) contrast(1.6) brightness(1.1)';
            ctx.drawImage(img, 0, 0);

            const worker = await Tesseract.createWorker('chi_sim');
            const { data: { text } } = await worker.recognize(canvas);
            await worker.terminate();

            const cleanText = text.replace(/[^\u4e00-\u9fa5]/g, '');
            processText(cleanText);
            document.getElementById('loading').classList.add('hidden');
        };
    };

    function processText(text) {
        let i = 0;
        const grid = document.getElementById('word-grid');
        while (i < text.length) {
            let pair = text[i] + (text[i+1] || "");
            let word = dictionary[pair] ? pair : text[i];
            
            const btn = document.createElement('div');
            btn.className = 'word-btn';
            btn.innerText = word;
            btn.onclick = () => showDetail(word);
            grid.appendChild(btn);
            
            i += word.length;
        }
    }

    function showDetail(word) {
        const entry = dictionary[word] || { pinyin: "N/A", english: "No definition found" };
        document.getElementById('zh-text').innerText = word;
        document.getElementById('py-text').innerText = entry.pinyin;
        document.getElementById('en-text').innerText = entry.english;
        document.getElementById('detail-view').classList.remove('hidden');
        
        speakNow(word);
        addToHistory(word, entry);
    }

    function addToHistory(word, entry) {
        if (historyData.has(word)) return;
        historyData.add(word);

        const list = document.getElementById('history-list');
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
            <div>
                <b style="font-size:1.4rem;">${word}</b> 
                <span style="color:var(--primary); margin-left:10px;">${entry.pinyin}</span>
                <div style="font-size:0.9rem; color:#666; margin-top:4px;">${entry.english.substring(0, 40)}...</div>
            </div>
            <button onclick="speakNow('${word}')" style="border:none; background:#f2f2f7; padding:10px; border-radius:50%; font-size:1.2rem;">🔊</button>
        `;
        list.prepend(item); // Newest words at the top
    }

    function closeDetail() { document.getElementById('detail-view').classList.add('hidden'); }

    function speakNow(word) {
        const t = word || document.getElementById('zh-text').innerText;
        const msg = new SpeechSynthesisUtterance(t);
        msg.lang = 'zh-CN';
        msg.rate = 0.8;
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
