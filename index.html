<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Apple 增强点读笔</title>
    <style>
        :root { --primary: #007aff; --bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        .hidden { display: none !important; }

        /* 引导区域 */
        .guide-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .hint { font-size: 0.9rem; color: #8e8e93; line-height: 1.4; margin: 15px 0; }
        
        /* 核心动作：粘贴 */
        #paste-box { 
            width: 100%; height: 80px; border: 2px dashed var(--primary); 
            border-radius: 15px; background: #fff; color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; cursor: pointer; margin-bottom: 20px;
        }

        /* 结果生成 */
        .word-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .word-btn { 
            font-size: 2.2rem; padding: 15px 25px; background: white; border-radius: 15px; 
            border: 2px solid #d1d1d6; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* 详情卡片 */
        #detail-view { 
            position: fixed; bottom: 0; left: 0; right: 0; background: white; 
            padding: 30px; border-radius: 25px 25px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); z-index: 100; 
        }
        .pinyin { color: var(--primary); font-size: 1.6rem; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0;">点读笔 Pro</h1>
        <p style="color:#666;">借用 Apple Live Text 达到 100% 准确度</p>
    </header>

    <div class="guide-card">
        <p class="hint">
            <strong>第一步：</strong>点击拍照，长按图片中的文字点击“全选”并“拷贝”<br>
            <strong>第二步：</strong>回到网页，点击下方蓝色框直接粘贴
        </p>
        
        <label for="camera-input" style="background:var(--primary); color:white; padding:15px; border-radius:12px; display:inline-block; margin-bottom:15px; width:80%;">
            📷 打开相机 (Live Text 模式)
        </label>
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">

        <div id="paste-box">
            点击这里粘贴 (Paste Here)
        </div>
    </div>

    <div id="word-grid" class="word-grid"></div>

    <div id="detail-view" class="hidden">
        <button onclick="this.parentElement.classList.add('hidden')" style="float:right; border:none; background:none; font-size:1.5rem; color:#ccc;">✕</button>
        <h2 id="card-zh" style="font-size:4.5rem; margin:10px 0;">--</h2>
        <p id="card-py" class="pinyin">--</p>
        <p id="card-en" style="color:#666; font-size:1.2rem; margin-bottom:20px;">--</p>
        <button onclick="speak()" style="background:var(--primary); color:white; border:none; width:100%; padding:20px; border-radius:15px; font-size:1.2rem; font-weight:600;">🔊 听发音 / Listen</button>
    </div>

<script>
    let dictionary = {};
    fetch('dictionary.json').then(r => r.json()).then(data => dictionary = data);

    const pasteBox = document.getElementById('paste-box');
    const wordGrid = document.getElementById('word-grid');

    // 监听粘贴事件
    window.addEventListener('paste', (e) => {
        const text = e.clipboardData.getData('text');
        if (text) processText(text);
    });

    // 也可以手动触发粘贴（iPad 兼容性）
    pasteBox.onclick = async () => {
        try {
            const text = await navigator.clipboard.readText();
            processText(text);
        } catch (err) {
            alert("请直接在屏幕长按选择‘粘贴’");
        }
    };

    function processText(rawText) {
        // 只保留汉字
        const text = rawText.replace(/[^\u4e00-\u9fa5]/g, '');
        wordGrid.innerHTML = "";
        const currentScanSet = new Set();
        let i = 0;

        while (i < text.length) {
            let pair = text[i] + (text[i+1] || "");
            let found = "";

            if (dictionary[pair]) {
                found = pair;
                i += 2;
            } else if (dictionary[text[i]]) {
                found = text[i];
                i += 1;
            } else {
                i += 1;
                continue;
            }

            if (found && !currentScanSet.has(found)) {
                currentScanSet.add(found);
                const btn = document.createElement('div');
                btn.className = 'word-btn';
                btn.innerText = found;
                btn.onclick = () => showDetail(found);
                wordGrid.appendChild(btn);
            }
        }
    }

    function showDetail(word) {
        const entry = dictionary[word];
        document.getElementById('card-zh').innerText = word;
        document.getElementById('card-py').innerText = entry.pinyin;
        document.getElementById('card-en').innerText = entry.english;
        document.getElementById('detail-view').classList.remove('hidden');
        speak(word);
    }

    function speak(t) {
        const text = t || document.getElementById('card-zh').innerText;
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-CN';
        msg.rate = 0.8;
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>
